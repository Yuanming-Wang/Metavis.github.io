{{- $currentPage := . -}}
<header class="header">
  <nav class="nav" aria-label="主导航">
    <div class="logo">
      <a href="{{ "" | relURL }}" accesskey="h" title="Metavis">Metavis</a>
    </div>
    {{- if site.Menus.main }}
      <ul id="menu">
        {{- range site.Menus.main }}
          {{- $isCurrent := or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}
          <li>
            <a href="{{ .URL | relURL }}" title="{{ .Title | default .Name }}"{{ if $isCurrent }} class="active"{{ end }}>{{ .Name }}</a>
          </li>
        {{- end }}
      </ul>
    {{- end }}
  </nav>
</header>
