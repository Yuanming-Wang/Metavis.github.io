{{- $custom := resources.Get "css/extended/custom.css" | minify | fingerprint -}}
<link rel="stylesheet" href="{{ $custom.RelPermalink }}" integrity="{{ $custom.Data.Integrity }}">

<script>
  const __slash = String.fromCharCode(92);
  window.MathJax = {
    tex: {
      inlineMath: [[__slash + "(", __slash + ")"], ["$", "$"]],
      displayMath: [[__slash + "[", __slash + "]"], ["$$", "$$"]]
    },
    svg: { fontCache: "global" }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
