baseURL = 'https://yuanming-wang.github.io/Metavis.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = 'Metavis'
theme = 'PaperMod'
enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = true

[pagination]
  pagerSize = 10

[taxonomies]
  category = 'categories'
  tag = 'tags'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[params]
  env = 'production'
  author = 'Metavis'
  description = 'Research notes on efficient inference, mechanistic interpretability, continual learning and AGI.'
  keywords = ['AGI', 'Embodied Intelligence', 'KV Cache', 'Attention', 'Mechanistic Interpretability', 'Scaling Laws', 'Computational Consciousness', 'Continual Learning', 'Efficient Inference']
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowWordCount = true
  mainSections = ['posts']
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  math = true

[params.homeInfoParams]
  Title = 'Metavis · 研究笔记'
  Content = '''终极目标是创造 AGI。

当前沿着“高效推理 → 注意力机制 → 机制可解释性 → Scaling Law 数学理论 → 计算意识理论”的路线推进，并独立研究持续学习与记忆机制。'''

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/Yuanming-Wang'

[[menu.main]]
  name = '首页'
  url = '/'
  weight = 10


[[menu.main]]
  name = '研究方向'
  url = '/research/'
  weight = 20

[[menu.main]]
  name = '文章'
  url = '/posts/'
  weight = 30

[[menu.main]]
  name = '归档'
  url = '/archives/'
  weight = 40

[[menu.main]]
  name = '关于'
  url = '/about/'
  weight = 50
