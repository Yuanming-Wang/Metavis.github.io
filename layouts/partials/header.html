{{- $currentPage := . -}}
<header class="header">
  <nav class="nav">
    <div class="logo">
      <a href="{{ "about/" | relURL }}" accesskey="h" title="Metavis (Alt + H)">Metavis</a>
      <div class="logo-switches">
        <button id="theme-toggle" class="theme-toggle" accesskey="t" title="切换主题" aria-label="切换主题" type="button">
          <svg class="moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="5.64"/></svg>
        </button>
      </div>
    </div>
    {{- if site.Menus.main }}
      <ul id="menu">
        {{- range site.Menus.main }}
          {{- $menuURL := .URL | absLangURL }}
          {{- $isCurrent := or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}
          <li>
            <a href="{{ .URL | relURL }}" title="{{ .Title | default .Name }}"{{ if $isCurrent }} class="active"{{ end }}>
              <span{{ if $isCurrent }} class="active"{{ end }}>{{ .Name }}</span>
            </a>
          </li>
        {{- end }}
      </ul>
    {{- end }}
  </nav>
</header>
