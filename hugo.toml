baseURL = 'https://yuanming-wang.github.io/Metavis.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = 'Metavis'
theme = 'PaperMod'
enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = true

[pagination]
  pagerSize = 10

[taxonomies]
  category = 'categories'
  tag = 'tags'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[params]
  env = 'production'
  author = 'Metavis'
  description = 'Research notes on efficient inference, mechanistic interpretability, continual learning, embodied intelligence and AGI.'
  keywords = ['AGI', 'Embodied Intelligence', 'KV Cache', 'Attention', 'Mechanistic Interpretability', 'Scaling Laws', 'Computational Consciousness', 'Continual Learning', 'Efficient Inference']
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowWordCount = true
  mainSections = ['posts']
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  math = true

[params.homeInfoParams]
  Title = 'Metavis · 研究笔记'
  Content = '''终极目标是创造 AGI。

三个并列方向共同指向 AGI：高效推理与机制可解释性、持续学习、具身智能。'''

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/Yuanming-Wang'

[[menu.main]]
  name = '关于'
  url = '/'
  weight = 10

[[menu.main]]
  name = '文章'
  url = '/posts/'
  weight = 20

[[menu.main]]
  name = '归档'
  url = '/archives/'
  weight = 30
