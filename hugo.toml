baseURL = 'https://yuanming-wang.github.io/Metavis.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = 'Metavis'
theme = 'PaperMod'
enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = true

[pagination]
  pagerSize = 10

[taxonomies]
  category = 'categories'
  tag = 'tags'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[params]
  env = 'production'
  author = 'Metavis'
  description = 'Research notes on resource-constrained model architectures, memory, continual learning and efficient inference.'
  keywords = ['AI', 'Model Architecture', 'Neural Memory', 'Continual Learning', 'Mechanistic Interpretability', 'Efficient Inference', 'Embodied Intelligence']
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowWordCount = true
  mainSections = ['posts']
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  math = true

[params.homeInfoParams]
  Title = 'Metavis · 研究笔记'
  Content = '''以真实物理与计算约束为出发点，研究信息表示、记忆、状态更新与持续学习。

这里记录模型架构、推理系统、数学推导、实验复盘，以及还没有答案的问题。'''

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/Yuanming-Wang'

[[menu.main]]
  name = '首页'
  url = '/'
  weight = 10


[[menu.main]]
  name = '研究方向'
  url = '/research/'
  weight = 20

[[menu.main]]
  name = '文章'
  url = '/posts/'
  weight = 30

[[menu.main]]
  name = '归档'
  url = '/archives/'
  weight = 40

[[menu.main]]
  name = '关于'
  url = '/about/'
  weight = 50
