<footer class="footer">
  {{- if site.Copyright }}
    <span>{{ site.Copyright | markdownify }}</span>
  {{- else }}
    <span>&copy; {{ now.Year }} <a href="{{ "" | absLangURL }}">{{ site.Title }}</a></span>
  {{- end }}
  <span class="footer-links">
    <a class="footer-github" href="https://github.com/Yuanming-Wang" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    <a class="footer-email" href="mailto:2284745191@qq.com">2284745191@qq.com ↗</a>
  </span>
</footer>
{{- end }}
