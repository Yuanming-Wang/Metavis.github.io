baseURL = 'https://yuanming-wang.github.io/Metavis.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = 'Metavis'
theme = 'PaperMod'
enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = true

[pagination]
  pagerSize = 10

[taxonomies]
  category = 'categories'
  tag = 'tags'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[params]
  env = 'production'
  author = 'Metavis'
  description = 'Research on efficient model architecture and inference, neural memory and continual learning, embodied intelligence, with mechanistic interpretability as a cross-cutting focus.'
  keywords = ['AGI', 'Efficient Model Architecture', 'Efficient Inference', 'Neural Memory', 'Continual Learning', 'Embodied Intelligence', 'Environmental Adaptation', 'Mechanistic Interpretability', 'Model Representations', 'Circuits', 'Information Flow']
  defaultTheme = 'light'
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowWordCount = true
  mainSections = ['posts']
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  math = true

[params.homeInfoParams]
  Title = 'Metavis · 研究笔记'
  Content = '''从真实计算与物理约束出发，探索高效模型架构、神经记忆与持续学习，以及具身智能与环境适应；机制可解释性贯穿其中。'''

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/Yuanming-Wang'

[[menu.main]]
  name = '关于'
  url = '/'
  weight = 10

[[menu.main]]
  name = '文章'
  url = '/posts/'
  weight = 20

[[menu.main]]
  name = '归档'
  url = '/archives/'
  weight = 30
