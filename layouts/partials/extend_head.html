{{- $custom := resources.Get "css/extended/custom.css" | minify | fingerprint -}}\n<link rel="stylesheet" href="{{ $custom.RelPermalink }}" integrity="{{ $custom.Data.Integrity }}">\n\n<script>\n  const __slash = String.fromCharCode(92);\n  window.MathJax = {\n    tex: {\n      inlineMath: [[__slash + "(", __slash + ")"], ["$", "$"]],\n      displayMath: [[__slash + "[", __slash + "]"], ["$$", "$$"]]\n    },\n    svg: { fontCache: "global" }\n  };\n</script>\n<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>\n
